<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Scientific Calculator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #202b55, #080b18 65%);
  font-family: Arial, sans-serif;
  padding: 15px;
}

.calculator {
  width: 100%;
  max-width: 390px;
  padding: 22px;
  border: 1px solid #344b86;
  border-radius: 28px;
  background: rgba(13, 19, 39, 0.96);
  box-shadow: 0 0 35px #1768ff35;
}

h2 {
  color: #63e8ff;
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 2px;
  text-shadow: 0 0 12px #00cfff;
}

#screen {
  width: 100%;
  height: 90px;
  border: 1px solid #283c69;
  outline: none;
  border-radius: 15px;
  background: #070c1b;
  color: #70f7ff;
  font-size: 29px;
  text-align: right;
  padding: 15px;
  margin-bottom: 18px;
  box-shadow: inset 0 0 12px #000;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 54px;
  border: 1px solid #27395f;
  border-radius: 13px;
  color: white;
  background: linear-gradient(145deg, #1b2745, #10172d);
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px #0004;
  transition: 0.15s;
}

button:active {
  transform: scale(0.92);
  box-shadow: 0 0 15px #00d9ff;
}

.function {
  color: #6eeaff;
}

.operator {
  color: #d2a4ff;
  background: #282047;
}

.clear {
  color: #ff809c;
  background: #401b32;
}

.equal {
  background: linear-gradient(135deg, #087eff, #a02cff);
  border: none;
  box-shadow: 0 0 14px #526dff70;
}

.zero {
  grid-column: span 2;
}

.footer {
  text-align: center;
  color: #7d91bb;
  font-size: 11px;
  margin-top: 18px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="calculator">
  <h2>NEON CALC</h2>

  <input id="screen" type="text"
         placeholder="0"
         readonly aria-label="Calculator display">

  <div class="buttons">
    <button class="clear" onclick="clearScreen()">AC</button>
    <button class="clear" onclick="del()">DEL</button>
    <button class="operator" onclick="add('%')">%</button>
    <button class="operator" onclick="add('/')">÷</button>

    <button class="function" onclick="fn('sin')">sin</button>
    <button class="function" onclick="fn('cos')">cos</button>
    <button class="function" onclick="fn('tan')">tan</button>
    <button class="operator" onclick="add('*')">×</button>

    <button class="function" onclick="fn('sqrt')">√</button>
    <button class="function" onclick="square()">x²</button>
    <button class="function" onclick="fn('log')">log</button>
    <button class="operator" onclick="add('-')">−</button>

    <button class="function" onclick="add('(')">(</button>
    <button class="function" onclick="add(')')">)</button>
    <button class="function" onclick="add('.')">.</button>
    <button class="operator" onclick="add('+')">+</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="function" onclick="add('pi')">π</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="function" onclick="add('e')">e</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="function" onclick="add('^')">xʸ</button>

    <button class="zero" onclick="add('0')">0</button>
    <button class="function" onclick="add('00')">00</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>

  <div class="footer">SCIENTIFIC • SMART • NEON</div>
</div>

<script>
const screen = document.getElementById("screen");

function add(value) {
  if (screen.value === "Error") screen.value = "";
  screen.value += value;
}

function clearScreen() {
  screen.value = "";
}

function del() {
  screen.value = screen.value.slice(0, -1);
}

function fn(name) {
  if (screen.value === "Error") screen.value = "";
  screen.value += name + "(";
}

function square() {
  if (screen.value) screen.value = "(" + screen.value + ")^2";
}

function calculate() {
  try {
    let expression = screen.value
      .replace(/π/g, "pi");

    if (!expression.trim()) return;

    // Convert scientific functions to JavaScript Math functions.
    expression = expression
      .replace(/\bpi\b/g, "Math.PI")
      .replace(/\be\b/g, "Math.E")
      .replace(/\bsin\(/g, "Math.sin(Math.PI/180*(")
      .replace(/\bcos\(/g, "Math.cos(Math.PI/180*(")
      .replace(/\btan\(/g, "Math.tan(Math.PI/180*(")
      .replace(/\bsqrt\(/g, "Math.sqrt(")
      .replace(/\blog\(/g, "Math.log10(")
      .replace(/\^/g, "**")
      .replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

    // Accept only calculator expression characters.
    if (!/^[0-9+\-*/().%\sA-Za-z]*$/.test(expression) ||
        /[A-Za-z](?![A-Za-z])/.test(expression.replace(
          /Math\.(PI|E|sin|cos|tan|sqrt|log10)/g, ""))) {
      throw new Error("Invalid");
    }

    // Only the Math operations and syntax above are permitted.
    if (/[^0-9+\-*/().\sA-Za-z]/.test(expression) ||
        /[A-Za-z]/.test(expression.replace(
          /Math\.(PI|E|sin|cos|tan|sqrt|log10)/g, ""))) {
      throw new Error("Invalid");
    }

    const result = Function('"use strict"; return (' +
      expression + ')')();

    if (typeof result !== "number" || !Number.isFinite(result)) {
      throw new Error("Invalid");
    }

    screen.value = String(Number(result.toPrecision(12)));
  } catch (error) {
    screen.value = "Error";
  }
}
</script>

</body>
</html>
